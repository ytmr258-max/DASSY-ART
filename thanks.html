<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תודה רבה! | DASSY ARTS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .thanks-wrapper {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .thanks-card {
            background-color: #ffffff;
            border: 1.5px solid #e2d9d0;
            border-radius: 20px;
            padding: 3rem 2rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .thanks-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .thanks-title {
            font-family: var(--font-heading, sans-serif);
            font-size: 2.2rem;
            color: var(--text-primary, #3d312a);
            margin-bottom: 1rem;
        }

        .thanks-text {
            font-size: 1.1rem;
            color: var(--text-secondary, #706359);
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .btn-return {
            display: inline-block;
            background-color: #8b5a2b;
            color: #ffffff;
            padding: 0.9rem 2.2rem;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(139, 90, 43, 0.2);
        }

        .btn-return:hover {
            background-color: #704720;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(139, 90, 43, 0.3);
        }
    </style>
</head>
<body>

    <main class="thanks-wrapper">
        <section class="thanks-card">
            <div class="thanks-icon">✨</div>
            <h1 class="thanks-title">תודה רבה!</h1>
            <p class="thanks-text">
                הפנייה שלך התקבלה בהצלחה.<br>
                אנו מעריכים את הפנייה ונהיה איתך בקשר בהקדם האפשרי.
            </p>
            <a href="index.html" class="btn-return">חזרה לגלריה</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 סטודיו לאמנות ועבודות יד. כל הזכויות שמורות.</p>
    </footer>

</body>
</html>
